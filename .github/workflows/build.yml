name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build app with PyInstaller
        run: pyinstaller planning-admr.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer.iss

      - name: Zip portable app
        run: Compress-Archive -Path 'dist\Planning ADMR' -DestinationPath 'Planning-ADMR-portable-win64.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            Setup-Planning-ADMR-*.exe
            Planning-ADMR-portable-win64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build app with PyInstaller
        run: pyinstaller planning-admr.spec

      - name: Build DMG
        run: |
          mkdir -p dmg-staging
          cp -R "dist/Planning ADMR.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Planning ADMR" -srcfolder dmg-staging \
            -ov -format UDZO "Planning-ADMR-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: Planning-ADMR-macos.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
